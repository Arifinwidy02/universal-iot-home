name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: app (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  simulator:
    name: simulator (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: simulator/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npm run typecheck
