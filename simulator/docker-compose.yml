services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iothome-mosquitto
    ports:
      - "1883:1883"   # MQTT, for the simulator process and mosquitto_sub
      - "9001:9001"   # MQTT over WebSocket, for the React Native app
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
