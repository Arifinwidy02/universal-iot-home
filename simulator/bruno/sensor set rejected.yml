info:
  name: sensor set rejected
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL_3000}}/devices/sensor-1/set"
  body:
    type: json
    data: |-
      {
        "on": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 400", function () {
          expect(res.getStatus()).to.equal(400);
        });
        test("error explains sensor is read-only", function () {
          expect(res.getBody().error).to.include("read-only");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
