info:
  name: get device
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL_3000}}/devices/plug-1"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns plug state", function () {
          expect(res.getBody()).to.have.property("on");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
