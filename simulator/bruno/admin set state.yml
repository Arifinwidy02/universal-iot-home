info:
  name: admin set state
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL_3000}}/admin/devices/sensor-1/state"
  body:
    type: json
    data: |-
      {
        "temperature": 27.5
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("sensor value changed", function () {
          expect(res.getBody().temperature).to.equal(27.5);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
